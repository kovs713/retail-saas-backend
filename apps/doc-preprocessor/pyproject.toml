[project]
name = "doc-preprocessor"
version = "0.1.0"
description = "Microservice for document preprocessing"
authors = [
    {name = "kovs713",email = "ovsyannikovkostyan@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "fastapi[standard] (>=0.135.3,<0.136.0)",
    "uvicorn>=0.34.0",
    "python-multipart (>=0.0.26,<0.0.27)",
    "pypdf (>=5.4.0,<6.0.0)",
    "python-docx (>=1.1.2,<2.0.0)",
    "docx (>=0.2.4,<0.3.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false
