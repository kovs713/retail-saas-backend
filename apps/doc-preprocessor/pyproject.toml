[project]
name = "doc-preprocessor"
version = "0.1.0"
description = "Microservice for document preprocessing"
authors = [
    {name = "kovs713",email = "ovsyannikovkostyan@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "docling>=2.93.0",
    "fastapi[standard]>=0.135.3,<0.136.0",
    "uvicorn>=0.34.0",
    "python-multipart>=0.0.26,<0.0.27",
    "python-docx>=1.1.2,<2.0.0",
    "torch",
    "torchvision",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
